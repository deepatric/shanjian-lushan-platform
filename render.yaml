services:
  - type: web
    name: shanjian-lushan-api-deepatric
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run server:generate
    startCommand: npm run server:start
    initialDeployHook: npm run server:deploy:init
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shanjian-lushan-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://deepatric.github.io
      - key: ADMIN_ACCOUNTS_JSON
        sync: false

databases:
  - name: shanjian-lushan-db
    databaseName: lushan_platform
    user: shanjian
    plan: free
    region: singapore
